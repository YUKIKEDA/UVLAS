name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: select affected checks
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.scope.outputs.build }}
      benchmark: ${{ steps.scope.outputs.benchmark }}
      binding: ${{ steps.scope.outputs.binding }}
      format: ${{ steps.scope.outputs.format }}
      python: ${{ steps.scope.outputs.python }}
      skills: ${{ steps.scope.outputs.skills }}
      rd: ${{ steps.scope.outputs.rd }}
      trace: ${{ steps.scope.outputs.trace }}
      checks: ${{ steps.scope.outputs.checks }}
      test_regex: ${{ steps.scope.outputs.test_regex }}
      build_targets: ${{ steps.scope.outputs.build_targets }}
      cpp_files: ${{ steps.scope.outputs.cpp_files }}
      format_files: ${{ steps.scope.outputs.format_files }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check selection and aggregation
        run: python3 tools/dev/ci_scope_test.py
      - name: Select affected checks
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 tools/dev/ci_scope.py

  windows:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: build and test (windows, msvc)
    runs-on: windows-2025
    env:
      CI_TEST_REGEX: ${{ needs.changes.outputs.test_regex }}
      CI_BUILD_TARGETS: ${{ needs.changes.outputs.build_targets }}
    steps:
      - uses: actions/checkout@v7
      - name: Select qualified MSVC 14.51
        run: pwsh -NoProfile -File tools/dev/ci-msvc.ps1
      - name: vcpkg at a commit that holds the manifest baseline
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          path: out/vcpkg
          fetch-depth: 0
      - name: vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: out/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-ports/**') }}
      # A PowerShell step fails only on the exit code of its last native command.
      # Every command whose failure has to stop the job is therefore a step of its own.
      - name: Bootstrap vcpkg
        run: ./out/vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: vcpkg environment
        run: |
          New-Item -ItemType Directory -Force out/vcpkg-cache | Out-Null
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE/out/vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_DEFAULT_BINARY_CACHE=$env:GITHUB_WORKSPACE/out/vcpkg-cache" >> $env:GITHUB_ENV
      - name: Compiler version
        run: pwsh -NoProfile -File tools/dev/msvc.ps1 cl
      - name: Configure
        run: pwsh -NoProfile -File tools/dev/msvc.ps1 cmake --preset windows-msvc
      - name: Build Debug
        run: |
          if ($env:CI_BUILD_TARGETS) {
            pwsh -NoProfile -File tools/dev/msvc.ps1 cmake --build --preset windows-debug --target ($env:CI_BUILD_TARGETS -split ' ')
          } else {
            pwsh -NoProfile -File tools/dev/msvc.ps1 cmake --build --preset windows-debug
          }
      - name: Test Debug
        run: pwsh -NoProfile -File tools/dev/msvc.ps1 ctest --preset windows-debug -R $env:CI_TEST_REGEX
      - name: Build Release
        run: |
          if ($env:CI_BUILD_TARGETS) {
            pwsh -NoProfile -File tools/dev/msvc.ps1 cmake --build --preset windows-release --target ($env:CI_BUILD_TARGETS -split ' ')
          } else {
            pwsh -NoProfile -File tools/dev/msvc.ps1 cmake --build --preset windows-release
          }
      - name: Test Release
        run: pwsh -NoProfile -File tools/dev/msvc.ps1 ctest --preset windows-release -R $env:CI_TEST_REGEX

  linux:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: build and test (linux, gcc 14, ${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-release, linux-sanitize]
    env:
      CXX: g++-14
      CI_TEST_REGEX: ${{ needs.changes.outputs.test_regex }}
      CI_BUILD_TARGETS: ${{ needs.changes.outputs.build_targets }}
      CI_CPP_FILES: ${{ needs.changes.outputs.cpp_files }}
    steps:
      - uses: actions/checkout@v7
      - name: vcpkg at a commit that holds the manifest baseline
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          path: out/vcpkg
          fetch-depth: 0
      - name: vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: out/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-ports/**') }}
      - name: Bootstrap vcpkg
        run: |
          mkdir -p out/vcpkg-cache
          ./out/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/out/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/out/vcpkg-cache" >> "$GITHUB_ENV"
      # The runner image ships GCC 14 and Ninja. Install only what is missing, so a
      # package mirror that cannot be reached does not fail the job.
      - name: Tools
        run: |
          missing=""
          command -v ninja >/dev/null || missing="$missing ninja-build"
          command -v g++-14 >/dev/null || missing="$missing g++-14"
          if [ -n "$missing" ]; then
            sudo apt-get update && sudo apt-get install -y $missing
          fi
          ninja --version
      - name: Compiler version
        run: g++-14 --version
      - name: Standard library model identity
        if: matrix.preset == 'linux-debug'
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          result = subprocess.run(["g++-14", "-std=c++23", "-dM", "-E", "-x", "c++", "-include", "bits/c++config.h", "-"], input="", text=True, capture_output=True, check=True)
          names = {"__cplusplus", "__GLIBCXX__", "_GLIBCXX_RELEASE", "_GLIBCXX_USE_CXX11_ABI", "_GLIBCXX_DEBUG", "__SIZEOF_POINTER__", "__SIZEOF_SIZE_T__", "__SIZEOF_LONG__", "__CHAR_BIT__"}
          macros = {}
          for line in result.stdout.splitlines():
              parts = line.split(maxsplit=2)
              if len(parts) >= 2 and parts[1] in names:
                  macros[parts[1]] = parts[2] if len(parts) == 3 else ""
          headers = pathlib.Path("/usr/include/c++/14/bits")
          hashes = {name: hashlib.sha256((headers / name).read_bytes()).hexdigest() for name in ("stl_vector.h", "vector.tcc", "stl_bvector.h", "basic_string.tcc", "cow_string.h")}
          packages = subprocess.run(["dpkg-query", "-W", "g++-14", "libstdc++-14-dev"], text=True, capture_output=True, check=True).stdout
          print(json.dumps({"schema": "uvlas.stdlib-model-environment/1", "macros": macros, "header_sha256": hashes, "packages": packages}, indent=2, sort_keys=True))
          PY
      - name: Configure, build, test
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }} ${CI_BUILD_TARGETS:+--target $CI_BUILD_TARGETS}
          ctest --preset ${{ matrix.preset }} -R "$CI_TEST_REGEX"
      - name: clang-tidy
        if: matrix.preset == 'linux-debug' && needs.changes.outputs.format == 'true'
        run: |
          pipx install clang-tidy==21.1.1
          if [ -n "$CI_CPP_FILES" ]; then
            clang-tidy -p out/build/linux-debug --quiet $CI_CPP_FILES
          else
            clang-tidy -p out/build/linux-debug --quiet $(git ls-files 'src/*.cpp' 'tests/*.cpp' 'qa/*.cpp' ':(exclude)src/python/*.cpp')
          fi

  benchmark:
    needs: changes
    if: needs.changes.outputs.benchmark == 'true'
    name: compile optional benchmark (linux, gcc 14)
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          path: out/vcpkg
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: out/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-ports/**') }}
      - name: Bootstrap vcpkg
        run: |
          mkdir -p out/vcpkg-cache
          ./out/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/out/vcpkg-cache" >> "$GITHUB_ENV"
      - name: Configure and compile optional feature
        run: |
          cmake -S . -B out/build/linux-bench -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DUVLAS_BUILD_BENCHMARKS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/out/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_FEATURES=benchmarks \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/out/vcpkg_bench_installed"
          cmake --build out/build/linux-bench --target uvlas_kernel_bench
      - name: List the product kernel without timing it
        env:
          UVLAS_BENCH_MACHINE: ci-linux
        run: |
          export UVLAS_BENCH_CPU="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)"
          export UVLAS_BENCH_MEMORY_BYTES="$(awk '/^MemTotal:/ {printf "%.0f", $2 * 1024}' /proc/meminfo)"
          out/build/linux-bench/benchmarks/uvlas_kernel_bench --benchmark_list_tests=true | grep '^checked_extent_product$'

  binding:
    needs: changes
    if: needs.changes.outputs.binding == 'true'
    name: Python ownership (${{ matrix.os }}, CPython 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          path: out/vcpkg
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: out/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-ports/**') }}
      - name: NumPy 2
        run: python -m pip install -r tests/python/requirements.txt
      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: ./out/vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        run: ./out/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force out/vcpkg-cache | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE="$env:GITHUB_WORKSPACE/out/vcpkg-cache"
          $bindingPython=(Get-Command python).Source
          pwsh -NoProfile -File tools/dev/msvc.ps1 cmake -S . -B out/build/python -G 'Ninja Multi-Config' -DUVLAS_BUILD_PYTHON=ON -DUVLAS_WARNINGS_AS_ERRORS=ON -DBUILD_TESTING=ON '-DVCPKG_MANIFEST_FEATURES=tests;python' -D "Python3_EXECUTABLE=$bindingPython" -D "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/out/vcpkg/scripts/buildsystems/vcpkg.cmake" -D "VCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/out/vcpkg_python_installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/dev/msvc.ps1 cmake --build out/build/python --config Release --target uvlas_python uvlas_cli
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File tools/dev/msvc.ps1 ctest --test-dir out/build/python -C Release -R '^python\.(ownership|case_file_operations)$' --output-on-failure
      - name: Configure, build and test (Linux)
        if: runner.os == 'Linux'
        env:
          CXX: g++-14
        run: |
          mkdir -p out/vcpkg-cache
          export VCPKG_DEFAULT_BINARY_CACHE="$GITHUB_WORKSPACE/out/vcpkg-cache"
          cmake -S . -B out/build/python -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUVLAS_BUILD_PYTHON=ON -DUVLAS_WARNINGS_AS_ERRORS=ON -DBUILD_TESTING=ON '-DVCPKG_MANIFEST_FEATURES=tests;python' \
            -DPython3_EXECUTABLE="$(command -v python)" \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/out/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/out/vcpkg_python_installed"
          cmake --build out/build/python --target uvlas_python uvlas_cli
          ctest --test-dir out/build/python -R '^python\.(ownership|case_file_operations)$' --output-on-failure
      - name: clang-tidy configured Python module (Linux)
        if: runner.os == 'Linux'
        run: |
          pipx install clang-tidy==21.1.1
          clang-tidy -p out/build/python --quiet src/python/module.cpp

  checks:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    name: format, skills, R&D tree
    runs-on: ubuntu-24.04
    env:
      CI_FORMAT_FILES: ${{ needs.changes.outputs.format_files }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Formatting
        if: needs.changes.outputs.format == 'true'
        run: |
          pip install clang-format==21.1.2
          if [ -n "$CI_FORMAT_FILES" ]; then
            for source in $CI_FORMAT_FILES; do
              [ ! -f "$source" ] || clang-format --dry-run --Werror "$source"
            done
          else
            clang-format --dry-run --Werror $(git ls-files 'src/*.cpp' 'src/*.hpp' 'include/*.hpp' 'tests/*.cpp' 'tests/*.hpp' 'qa/*.cpp' 'qa/*.hpp' 'benchmarks/*.cpp' 'benchmarks/*.hpp')
          fi
      - name: Python tools
        if: needs.changes.outputs.python == 'true'
        run: |
          pip install ruff==0.17.4 pyright==1.1.408
          ruff check .
          ruff format --check .
          pyright
      - name: Traceability
        if: needs.changes.outputs.trace == 'true'
        run: python -X utf8 tools/qa/trace.py check
      - name: Skill copies
        if: needs.changes.outputs.skills == 'true'
        run: python tools/dev/sync_skills.py --check
      - name: R&D tree
        if: needs.changes.outputs.rd == 'true'
        run: python -X utf8 tools/rd/check_tree.py

  # The single required check on main. A job added above is added to `needs` in the same PR.
  ci:
    name: ci
    if: always()
    needs: [changes, windows, linux, benchmark, binding, checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Every required job passed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/dev/ci_scope.py --verify-needs
